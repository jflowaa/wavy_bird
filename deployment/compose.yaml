name: wavy-bird

services:
  wavy-bird:
    image: wavy_bird:${IMAGE_TAG}
    container_name: wavy-bird
    restart: unless-stopped
    networks: [edge]
    mem_limit: 64m
    security_opt: [no-new-privileges:true]
    logging:
      driver: k8s-file
      options:
        max-size: "15m"

networks:
  edge:
    external: true
